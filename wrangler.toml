name = "nutrition-fitness-center-management-system"
main = "./src/worker.ts"
compatibility_date = "2026-09-16"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
ENVIRONMENT = "development"
API_VERSION = "v1"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Hyperdrive is intentionally configured in Cloudflare for the deployment environment.
# Add the binding named HYPERDRIVE when the Neon database connection is ready.
